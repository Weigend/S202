name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout S202
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build WFX
        run: |
          # Same source of truth as build-all.sh: the wfx.version property.
          WFX_VERSION="$(sed -n 's:.*<wfx\.version>\(.*\)</wfx\.version>.*:\1:p' analyzer/pom.xml | head -1)"
          test -n "$WFX_VERSION" || { echo "wfx.version not found in analyzer/pom.xml"; exit 1; }
          git clone --depth 1 --branch "v${WFX_VERSION}" https://github.com/Weigend/wfx.git /tmp/wfx
          cd /tmp/wfx
          mvn install -DskipTests --batch-mode

      - name: Build S202
        run: mvn clean install --batch-mode
